<!DOCTYPE html>
<html>
<head>
  <title>Google Calendar - Connecting...</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 100%);
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e5e7eb;
      border-top-color: #0d9488;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.5rem;
      color: #134e4a;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Connecting Google Calendar...</h1>
    <p>Please wait while we complete the connection.</p>
  </div>
  <script>
    // Extract the authorization code from the URL
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const error = urlParams.get('error');

    if (error) {
      document.querySelector('h1').textContent = 'Connection Failed';
      document.querySelector('p').textContent = 'There was an error connecting your Google Calendar.';
      document.querySelector('.spinner').style.display = 'none';
    } else if (code) {
      // Send the code back to the parent window
      if (window.opener) {
        window.opener.postMessage({ type: 'google-calendar-callback', code }, '*');
      } else {
        document.querySelector('h1').textContent = 'Connection Complete';
        document.querySelector('p').textContent = 'You can close this window now.';
        document.querySelector('.spinner').style.display = 'none';
      }
    }
  </script>
</body>
</html>
